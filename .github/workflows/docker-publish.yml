name: Docker Build & Push

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./hospital-backend/HospitalManagement
          push: true
          tags: roman913/hospital-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./hospital-frontend
          push: true
          tags: roman913/hospital-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ec2-user

            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            mkdir -p /home/ec2-user/app

            cat > /home/ec2-user/app/docker-compose.yml << 'EOF'
            services:
              frontend:
                image: roman913/hospital-frontend:latest
                restart: always
                ports:
                  - "3000:80"
                depends_on:
                  - api
                networks:
                  - app-network

              api:
                image: roman913/hospital-backend:latest
                restart: always
                ports:
                  - "5171:5171"
                environment:
                  - ConnectionStrings__HospitalDBConnectionString=Server=db,1433;Database=HospitalManagementDB;User ID=sa;Password=YourStrong!Password123;TrustServerCertificate=True;
                  - ASPNETCORE_ENVIRONMENT=Development
                depends_on:
                  - db
                networks:
                  - app-network

              db:
                image: mcr.microsoft.com/mssql/server:2022-latest
                restart: always
                environment:
                  ACCEPT_EULA: "Y"
                  SA_PASSWORD: "YourStrong!Password123"
                  MSSQL_PID: "Express"
                ports:
                  - "1433:1433"
                volumes:
                  - sql_data:/var/opt/mssql
                networks:
                  - app-network

            volumes:
              sql_data:

            networks:
              app-network:
                driver: bridge
            EOF

            cd /home/ec2-user/app
            sudo docker-compose down --volumes
            sudo docker-compose pull
            sudo docker-compose up -d