services:
  frontend:
    build:
      context: ./hospital-frontend
      dockerfile: Dockerfile
    image: roman913/hospital-frontend:latest
    restart: always
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_started
    networks:
      - app-network

  api:
    build:
      context: ./hospital-backend/HospitalManagement
      dockerfile: Dockerfile
    image: roman913/hospital-backend:latest
    restart: always
    ports:
      - "5171:5171"
    environment:
      - ConnectionStrings__HospitalDBConnectionString=Server=db,1433;Database=HospitalManagementDB;User ID=sa;Password=YourStrong!Password123;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -Q 'SELECT 1' -No" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sql_data:

networks:
  app-network:
    driver: bridge
